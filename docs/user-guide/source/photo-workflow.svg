<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="410" viewBox="0 0 1240 410" role="img"><title>From camera card to a collection worth keeping</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#182d39"/><stop offset="1" stop-color="#0b1720"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m0 0 7 4-7 4" fill="#cfad6d"/></marker></defs><rect width="1240" height="410" rx="24" fill="url(#bg)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="57" fill="#f5f0e5" font-size="30">From camera card to a collection worth keeping</text><text x="38" y="91" fill="#bfd0d9" font-size="18">A clear path, with your originals preserved along the way.</text><path d="M38 114H1202" stroke="#344b58"/><rect x="38" y="148" width="276" height="151" rx="15" fill="#203744" stroke="#49606c"/><circle cx="65" cy="178" r="15" fill="#dfbd7f"/><text x="65" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#182a35">1</text><text x="60" y="220" fill="#fff" font-size="22">Import</text><text x="60" y="252" fill="#bfd0d9" font-size="17">Copy from the card.</text><text x="60" y="279" fill="#bfd0d9" font-size="17">Verify the saved bytes.</text><path d="M316 223H330" stroke="#cfad6d" stroke-width="2" marker-end="url(#arrow)"/><rect x="334" y="148" width="276" height="151" rx="15" fill="#203744" stroke="#49606c"/><circle cx="361" cy="178" r="15" fill="#dfbd7f"/><text x="361" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#182a35">2</text><text x="356" y="220" fill="#fff" font-size="22">Create versions</text><text x="356" y="252" fill="#bfd0d9" font-size="17">Enhanced and B&amp;W each</text><text x="356" y="279" fill="#bfd0d9" font-size="17">start from the original.</text><path d="M612 223H626" stroke="#cfad6d" stroke-width="2" marker-end="url(#arrow)"/><rect x="630" y="148" width="276" height="151" rx="15" fill="#203744" stroke="#49606c"/><circle cx="657" cy="178" r="15" fill="#dfbd7f"/><text x="657" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#182a35">3</text><text x="652" y="220" fill="#fff" font-size="22">Curate in Lightbox</text><text x="652" y="252" fill="#bfd0d9" font-size="17">Rate, crop and choose</text><text x="652" y="279" fill="#bfd0d9" font-size="17">exact versions to share.</text><path d="M908 223H922" stroke="#cfad6d" stroke-width="2" marker-end="url(#arrow)"/><rect x="926" y="148" width="276" height="151" rx="15" fill="#203744" stroke="#49606c"/><circle cx="953" cy="178" r="15" fill="#dfbd7f"/><text x="953" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#182a35">4</text><text x="948" y="220" fill="#fff" font-size="22">Share and archive</text><text x="948" y="252" fill="#bfd0d9" font-size="17">Upload your selections.</text><text x="948" y="279" fill="#bfd0d9" font-size="17">Verify the archive copy.</text><rect x="38" y="342" width="1164" height="42" rx="9" fill="#152b36"/><text x="55" y="369" fill="#e4ca99" font-size="18">Stage keeps your working library and decisions. A selective archive contains only the files you choose.</text></g></svg>