<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="410" viewBox="0 0 1240 410" role="img"><title>Prepare the picture. Then finish the story.</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#182d39"/><stop offset="1" stop-color="#0b1720"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m0 0 7 4-7 4" fill="#cfad6d"/></marker></defs><rect width="1240" height="410" rx="24" fill="url(#bg)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="57" fill="#f5f0e5" font-size="30">Prepare the picture. Then finish the story.</text><text x="38" y="91" fill="#bfd0d9" font-size="18">Keep expensive picture preparation separate from titles, scorecards and music.</text><path d="M38 114H1202" stroke="#344b58"/><rect x="38" y="148" width="276" height="151" rx="15" fill="#203744" stroke="#49606c"/><circle cx="65" cy="178" r="15" fill="#dfbd7f"/><text x="65" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#182a35">1</text><text x="60" y="220" fill="#fff" font-size="22">Build the sequence</text><text x="60" y="252" fill="#bfd0d9" font-size="17">Choose clips and order.</text><text x="60" y="279" fill="#bfd0d9" font-size="17">Set picture filters.</text><path d="M316 223H330" stroke="#cfad6d" stroke-width="2" marker-end="url(#arrow)"/><rect x="334" y="148" width="276" height="151" rx="15" fill="#203744" stroke="#49606c"/><circle cx="361" cy="178" r="15" fill="#dfbd7f"/><text x="361" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#182a35">2</text><text x="356" y="220" fill="#fff" font-size="22">Prepare and review</text><text x="356" y="252" fill="#bfd0d9" font-size="17">Stabilise the clips.</text><text x="356" y="279" fill="#bfd0d9" font-size="17">Approve the picture.</text><path d="M612 223H626" stroke="#cfad6d" stroke-width="2" marker-end="url(#arrow)"/><rect x="630" y="148" width="276" height="151" rx="15" fill="#203744" stroke="#49606c"/><circle cx="657" cy="178" r="15" fill="#dfbd7f"/><text x="657" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#182a35">3</text><text x="652" y="220" fill="#fff" font-size="22">Titles and graphics</text><text x="652" y="252" fill="#bfd0d9" font-size="17">Name YouTube chapters.</text><text x="652" y="279" fill="#bfd0d9" font-size="17">Add visible cards if wanted.</text><path d="M908 223H922" stroke="#cfad6d" stroke-width="2" marker-end="url(#arrow)"/><rect x="926" y="148" width="276" height="151" rx="15" fill="#203744" stroke="#49606c"/><circle cx="953" cy="178" r="15" fill="#dfbd7f"/><text x="953" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#182a35">4</text><text x="948" y="220" fill="#fff" font-size="22">Finish and export</text><text x="948" y="252" fill="#bfd0d9" font-size="17">Set camera sound/music.</text><text x="948" y="279" fill="#bfd0d9" font-size="17">Create the updated final.</text><rect x="38" y="342" width="1164" height="42" rx="9" fill="#152b36"/><text x="55" y="369" fill="#e4ca99" font-size="18">Graphics and music edits can reuse valid prepared clips. Picture or source changes can require preparation again.</text></g></svg>